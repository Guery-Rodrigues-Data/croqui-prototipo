      <button class="editor-tool" type="button" data-tool="imagem" id="importarImagemBtn" title="Importar imagem do computador pra cobrir a área delimitada — clique de novo pra poder mover/redimensionar a que já foi importada">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button class="editor-tool" type="button" id="removerImagemBtn" title="Remover imagem importada" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
      </button>
      <input type="file" id="areaImagemInput" accept="image/*" style="display:none;" />
      <div class="editor-toolbar-sep"></div>
      <button class="editor-tool" data-tool="veicular" title="Adicionar grupo focal veicular">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="18" rx="4"/><circle cx="12" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="11" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="editor-tool" data-tool="pedestre" title="Adicionar grupo focal de pedestre">
        <svg viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M10.0406 5.13039L10.0538 5.12998C10.3486 5.12302 10.614 5.21252 10.8283 5.41653C10.9737 5.55328 11.073 5.73059 11.1132 5.92464C11.1496 6.09981 11.1407 6.30547 11.1408 6.48652L11.1407 7.1131C11.1406 7.96264 11.1314 8.82874 11.142 9.67703C11.275 9.84526 11.5316 10.1087 11.6838 10.2747L12.7226 11.4083C12.847 11.544 13.1158 11.8256 13.2203 11.9607C13.3146 12.0825 13.4955 12.5983 13.5583 12.7628L14.4062 14.9768C14.4657 15.1316 14.554 15.3441 14.6022 15.499C14.6293 15.5861 14.6421 15.6769 14.6401 15.7679C14.6353 15.994 14.5382 16.2086 14.3706 16.3631C13.9935 16.7141 13.4 16.6644 13.0912 16.2504C12.9681 16.0851 12.8585 15.7337 12.78 15.5275L12.0727 13.6815L11.899 13.2248C11.7577 12.8467 11.7619 12.8778 11.4823 12.5852C10.9735 12.0274 10.4376 11.4923 9.92453 10.932C9.75448 10.7462 9.1717 10.1909 9.10887 9.96641C9.06603 9.81329 9.08541 9.2621 9.08549 9.06855L9.08389 7.29763C8.81614 7.4617 8.36406 7.64182 8.11705 7.8102C8.07881 7.93687 8.02851 8.27513 8.00264 8.42168L7.79004 9.62517C7.74702 9.86848 7.72111 10.1854 7.57217 10.3845C7.44869 10.5492 7.26342 10.6582 7.05778 10.6872C6.86218 10.7138 6.65018 10.6516 6.49507 10.5325C6.33766 10.4127 6.23534 10.2359 6.21092 10.0413C6.20365 9.98381 6.20326 9.92568 6.20976 9.86812C6.22988 9.69388 6.27285 9.4859 6.30408 9.31002L6.47736 8.33586L6.6126 7.56957C6.63988 7.41523 6.6639 7.25213 6.70403 7.10108C6.74992 6.92832 6.87892 6.76082 7.03618 6.67243C7.19513 6.58308 7.35515 6.49626 7.5147 6.40855L8.50159 5.86665L9.25232 5.45216C9.52013 5.30434 9.72754 5.15522 10.0406 5.13039Z"/><path d="M8.6823 10.3336C8.69373 10.3434 8.68999 10.3388 8.69746 10.3496C8.85944 10.5831 9.0559 10.7824 9.25072 10.9884L9.87472 11.6516C9.66903 12.0095 9.41684 12.3988 9.1984 12.7525L7.24136 15.9202C7.15712 16.0567 7.06932 16.1967 6.98716 16.3339C6.85435 16.5557 6.71999 16.6776 6.47601 16.7711C6.2492 16.8555 5.95784 16.8083 5.75543 16.6835C5.5601 16.5647 5.42198 16.3728 5.37265 16.1518C5.27622 15.7203 5.54373 15.4165 5.75739 15.0694L7.86663 11.6488C8.13423 11.2147 8.40566 10.7609 8.6823 10.3336Z"/><path d="M10.4172 2.00341C11.1077 1.95315 11.7087 2.4643 11.7597 3.14506C11.8106 3.82582 11.2922 4.41838 10.6017 4.46856C9.9112 4.51874 9.31025 4.00761 9.25932 3.32691C9.20839 2.6462 9.72678 2.05366 10.4172 2.00341Z"/><path d="M11.6841 6.28729C11.705 6.29842 11.8079 6.40888 11.8348 6.43591L12.2644 6.86802L13.4813 8.10007L13.8341 8.45608C14.1007 8.72525 14.2782 8.93289 14.1698 9.34403C14.1343 9.47812 14.0628 9.57137 13.9676 9.67061C13.5942 9.99383 13.1662 9.93752 12.8364 9.58784C12.4676 9.19686 12.0407 8.83021 11.6763 8.43627C11.6673 8.31568 11.6732 8.12504 11.6732 7.99894L11.6737 6.61546C11.6738 6.53742 11.6695 6.35773 11.6841 6.28729Z"/><path d="M2 17.6244C2 17.417 2.17056 17.2488 2.38095 17.2488H3.90476C4.11516 17.2488 4.28571 17.417 4.28571 17.6244C4.28571 17.8318 4.11516 18 3.90476 18H2.38095C2.17056 18 2 17.8318 2 17.6244Z"/><path d="M5.42857 17.6244C5.42857 17.417 5.59913 17.2488 5.80952 17.2488H7.33333C7.54373 17.2488 7.71429 17.417 7.71429 17.6244C7.71429 17.8318 7.54373 18 7.33333 18H5.80952C5.59913 18 5.42857 17.8318 5.42857 17.6244Z"/><path d="M8.85714 17.6244C8.85714 17.417 9.0277 17.2488 9.2381 17.2488H10.7619C10.9723 17.2488 11.1429 17.417 11.1429 17.6244C11.1429 17.8318 10.9723 18 10.7619 18H9.2381C9.0277 18 8.85714 17.8318 8.85714 17.6244Z"/><path d="M12.2857 17.6244C12.2857 17.417 12.4563 17.2488 12.6667 17.2488H14.1905C14.4009 17.2488 14.5714 17.417 14.5714 17.6244C14.5714 17.8318 14.4009 18 14.1905 18H12.6667C12.4563 18 12.2857 17.8318 12.2857 17.6244Z"/><path d="M15.7143 17.6244C15.7143 17.417 15.8848 17.2488 16.0952 17.2488H17.619C17.8294 17.2488 18 17.417 18 17.6244C18 17.8318 17.8294 18 17.619 18H16.0952C15.8848 18 15.7143 17.8318 15.7143 17.6244Z"/></svg>
      </button>
      <div class="editor-toolbar-sep"></div>
      <button class="editor-tool" data-tool="texto" title="Adicionar anotação de texto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>
      </button>
      <div class="editor-toolbar-sep"></div>
      <button class="editor-tool" data-tool="regua" title="Régua — medir distância real no mapa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 15.5 15.5 3.5a1.5 1.5 0 0 1 2.12 0l2.88 2.88a1.5 1.5 0 0 1 0 2.12L8.5 20.5a1.5 1.5 0 0 1-2.12 0L2.5 17.62a1.5 1.5 0 0 1 0-2.12Z"/><path d="m14.5 6.5 2 2M11.5 9.5l2 2M8.5 12.5l2 2"/></svg>
      </button>
      <div class="editor-toolbar-sep"></div>
      <button class="editor-tool" type="button" id="filtrosBtn" title="Filtros" onclick="toggleFiltrosPanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M7 12h10M11 19h2"/></svg>
      </button>
    </div>

    <button type="button" class="listagem-layer-toggle" id="layerToggleBtn" title="Trocar camada do mapa" onclick="toggleMapLayer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      <span id="layerToggleLabel">Mapa</span>
    </button>

    <div class="draw-status" id="drawStatus" style="display:none;"></div>
    <div class="map-hint" id="hintSlot"></div>

    <div class="map-search" id="mapSearch" style="display:none;">
      <div class="map-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="enderecoInput" placeholder="Buscar endereço..." autocomplete="off" />
      </div>
      <div class="map-search-results" id="enderecoResults" style="display:none;"></div>
    </div>

    <div class="filtros-panel" id="filtrosPanel" style="display:none;">
      <div class="filtros-panel-title">Filtros</div>
      <label class="filtros-check"><input type="checkbox" id="fTodos" checked /> Todos</label>
      <label class="filtros-check filtros-check--indent"><input type="checkbox" id="fVeicular" checked /> Grupo Veicular</label>
      <label class="filtros-check filtros-check--indent"><input type="checkbox" id="fPedestre" checked /> Grupo Pedestre</label>
      <label class="filtros-check" style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px;">
        <input type="checkbox" id="fDirecoes" checked /> Mostrar direções no mapa
      </label>
    </div>

    <div class="teste-painel" id="testePainel" style="display:none;">
      <div class="teste-painel-header">
        <span class="teste-painel-live-dot"></span>
        <span class="teste-painel-controlador" id="testePainelControlador">—</span>
        <span class="teste-painel-ciclo" id="testePainelCiclo">Ciclo —</span>
        <button type="button" class="teste-painel-close" title="Parar teste em tempo real" onclick="toggleTesteTempoReal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="teste-painel-body" id="testePainelBody"></div>
      <div class="teste-painel-needle" id="testePainelNeedle"></div>
    </div>

    <div class="entity-drawer" id="entityDrawer"></div>

    <div class="anexo-preview" id="anexoPreview" style="display:none;">
      <div class="anexo-preview-header">
        <span class="anexo-preview-name" id="anexoPreviewName"></span>
        <button type="button" class="editor-form-close" id="anexoPreviewClose" title="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="anexo-preview-body" id="anexoPreviewBody"></div>
    </div>

    <div class="controlador-escolha" id="controladorEscolha" style="display:none;">
      <div class="controlador-escolha-card">
        <div class="controlador-escolha-header">
          <strong>Escolher controlador</strong>
          <p class="controlador-escolha-aviso">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            <span>Nenhum controlador encontrado nesta área. Escolha um controlador para ser o sub-controlador deste croqui.</span>
          </p>
        </div>
        <div class="controlador-escolha-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="controladorEscolhaSearch" placeholder="Buscar controlador por ID ou via..." autocomplete="off" />
        </div>
        <div class="controlador-escolha-items" id="controladorEscolhaItems"></div>
        <div class="controlador-escolha-actions">
          <button type="button" class="btn-secondary" id="controladorEscolhaCancelar">Cancelar</button>
          <button type="button" class="btn-primary" id="controladorEscolhaSalvar">Salvar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/data.js"></script>
<script src="assets/sheets-sync.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="assets/editor.js"></script>
</body>
</html>
